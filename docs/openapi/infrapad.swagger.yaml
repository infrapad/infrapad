swagger: "2.0"
info:
  title: infrapad/v1alpha1/infrapad.proto
  version: version not set
tags:
  - name: InfrapadService
consumes:
  - application/json
produces:
  - application/json
paths:
  /v1/documents:
    get:
      operationId: InfrapadService_ListDocuments
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListDocumentsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - InfrapadService
    post:
      summary: '----- Document operations -----'
      operationId: InfrapadService_CreateDocument
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateDocumentResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CreateDocumentRequest'
      tags:
        - InfrapadService
  /v1/{name}:
    get:
      operationId: InfrapadService_GetDocument
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetDocumentResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: name
          in: path
          required: true
          type: string
          pattern: documents/[^/]+
      tags:
        - InfrapadService
  /v1/{parent}/blocks:
    get:
      operationId: InfrapadService_ListBlocks
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListBlocksResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: parent
          in: path
          required: true
          type: string
          pattern: documents/[^/]+
      tags:
        - InfrapadService
    post:
      summary: '----- Block operations -----'
      operationId: InfrapadService_AddBlock
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1AddBlockResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: parent
          in: path
          required: true
          type: string
          pattern: documents/[^/]+
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/InfrapadServiceAddBlockBody'
      tags:
        - InfrapadService
  /v1/{parent}/blocks/{blockNumber}:
    get:
      operationId: InfrapadService_GetBlock
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetBlockResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: parent
          in: path
          required: true
          type: string
          pattern: documents/[^/]+
        - name: blockNumber
          in: path
          required: true
          type: integer
          format: int32
        - name: revisionNumber
          description: 0 means latest revision.
          in: query
          required: false
          type: integer
          format: int32
      tags:
        - InfrapadService
    put:
      operationId: InfrapadService_UpdateBlock
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1UpdateBlockResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: parent
          in: path
          required: true
          type: string
          pattern: documents/[^/]+
        - name: blockNumber
          in: path
          required: true
          type: integer
          format: int32
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/InfrapadServiceUpdateBlockBody'
      tags:
        - InfrapadService
  /v1/{parent}/blocks/{blockNumber}/history:
    get:
      operationId: InfrapadService_ListBlockHistory
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListBlockHistoryResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: parent
          in: path
          required: true
          type: string
          pattern: documents/[^/]+
        - name: blockNumber
          in: path
          required: true
          type: integer
          format: int32
      tags:
        - InfrapadService
definitions:
  InfrapadServiceAddBlockBody:
    type: object
    properties:
      block:
        $ref: '#/definitions/v1Block'
    required:
      - block
  InfrapadServiceUpdateBlockBody:
    type: object
    properties:
      block:
        $ref: '#/definitions/v1Block'
    required:
      - block
  protobufAny:
    type: object
    properties:
      '@type':
        type: string
    additionalProperties: true
  protobufNullValue:
    type: string
    enum:
      - NULL_VALUE
    default: NULL_VALUE
    description: |-
      Represents a JSON `null`.

      `NullValue` is a sentinel, using an enum with only one value to represent
      the null value for the `Value` type union.

      A field of type `NullValue` with any value other than `0` is considered
      invalid. Most ProtoJSON serializers will emit a Value with a `null_value` set
      as a JSON `null` regardless of the integer value, and so will round trip to
      a `0` value.

       - NULL_VALUE: Null value.
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
  v1AddBlockResponse:
    type: object
    properties:
      block:
        $ref: '#/definitions/v1Block'
  v1Block:
    type: object
    properties:
      name:
        type: string
        description: 'Resource name: "documents/{document}/blocks/{block}".'
        readOnly: true
      blockNumber:
        type: integer
        format: int32
        readOnly: true
      revisionNumber:
        type: integer
        format: int32
        readOnly: true
      authorId:
        type: string
      type:
        type: string
      status:
        type: string
        title: '"progressing" | "published" | "deleted"'
      createdAt:
        type: string
        format: date-time
        readOnly: true
      content:
        type: object
        title: |-
          Arbitrary content payload; structure is determined by `type`.
          The value is the inner extension content, not a host record
          envelope: producers never supply host timestamps.
          E.g. for "Core/Markdown": {"text": "…"}
          E.g. for "Prometheus/AlertsMatcher":
            {"labels_matchers": [...], "since": "…"}
    description: Block represents a single content block within a document.
    required:
      - type
      - content
  v1CreateDocumentRequest:
    type: object
    properties:
      title:
        type: string
      namespace:
        type: string
      blocks:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Block'
        description: Optional initial blocks.
    required:
      - title
  v1CreateDocumentResponse:
    type: object
    properties:
      document:
        $ref: '#/definitions/v1Document'
  v1Document:
    type: object
    properties:
      name:
        type: string
        description: 'Resource name: "documents/{document}".'
        readOnly: true
      status:
        type: string
        title: '"active" | "archived"'
        readOnly: true
      title:
        type: string
      namespace:
        type: string
      createdAt:
        type: string
        format: date-time
        readOnly: true
      blocks:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Block'
        readOnly: true
    description: Document represents an investigation document.
    required:
      - title
  v1GetBlockResponse:
    type: object
    properties:
      block:
        $ref: '#/definitions/v1Block'
  v1GetDocumentResponse:
    type: object
    properties:
      document:
        $ref: '#/definitions/v1Document'
  v1ListBlockHistoryResponse:
    type: object
    properties:
      blocks:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Block'
  v1ListBlocksResponse:
    type: object
    properties:
      blocks:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Block'
  v1ListDocumentsResponse:
    type: object
    properties:
      documents:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Document'
  v1UpdateBlockResponse:
    type: object
    properties:
      block:
        $ref: '#/definitions/v1Block'
