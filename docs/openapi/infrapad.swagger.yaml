swagger: "2.0"
info:
  title: infrapad/v1alpha1/infrapad.proto
  version: version not set
tags:
  - name: InfrapadService
consumes:
  - application/json
produces:
  - application/json
paths:
  /v1/documents:
    get:
      operationId: InfrapadService_ListDocuments
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListDocumentsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - InfrapadService
    post:
      summary: '----- Document operations -----'
      operationId: InfrapadService_CreateDocument
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateDocumentResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CreateDocumentRequest'
      tags:
        - InfrapadService
  /v1/{name}:
    get:
      operationId: InfrapadService_GetDocument
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetDocumentResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: name
          in: path
          required: true
          type: string
          pattern: documents/[^/]+
      tags:
        - InfrapadService
  /v1/{parent}/blocks:
    get:
      operationId: InfrapadService_ListBlocks
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListBlocksResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: parent
          in: path
          required: true
          type: string
          pattern: documents/[^/]+
      tags:
        - InfrapadService
    post:
      summary: '----- Block operations -----'
      operationId: InfrapadService_AddBlock
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1AddBlockResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: parent
          in: path
          required: true
          type: string
          pattern: documents/[^/]+
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/InfrapadServiceAddBlockBody'
      tags:
        - InfrapadService
  /v1/{parent}/blocks/{blockNumber}:
    get:
      operationId: InfrapadService_GetBlock
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetBlockResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: parent
          in: path
          required: true
          type: string
          pattern: documents/[^/]+
        - name: blockNumber
          in: path
          required: true
          type: integer
          format: int32
        - name: revisionNumber
          description: 0 means latest revision.
          in: query
          required: false
          type: integer
          format: int32
      tags:
        - InfrapadService
    put:
      operationId: InfrapadService_UpdateBlock
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1UpdateBlockResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: parent
          in: path
          required: true
          type: string
          pattern: documents/[^/]+
        - name: blockNumber
          in: path
          required: true
          type: integer
          format: int32
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/InfrapadServiceUpdateBlockBody'
      tags:
        - InfrapadService
  /v1/{parent}/blocks/{blockNumber}/history:
    get:
      operationId: InfrapadService_ListBlockHistory
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListBlockHistoryResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: parent
          in: path
          required: true
          type: string
          pattern: documents/[^/]+
        - name: blockNumber
          in: path
          required: true
          type: integer
          format: int32
      tags:
        - InfrapadService
  /v1/{parent}/blocks/{blockNumber}:submitPayload:
    post:
      summary: |-
        Submits a complete transient payload snapshot for an existing live
        root primary block whose type supports expansion (e.g. a
        "Slack/Thread" reference). The server validates the payload, runs
        the registered extension selected by the stored block type, and
        reconciles the generated output atomically. The payload is never
        persisted. Concurrent submissions serialize per document; the last
        successful submission wins. Identical snapshots create no
        revisions.
      description: |-
        Failures use standard gRPC error details (google.rpc.ErrorInfo with
        a stable reason and target metadata, google.rpc.BadRequest field
        violations where available) and leave the document unchanged.
      operationId: InfrapadService_SubmitBlockPayload
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1SubmitBlockPayloadResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: parent
          in: path
          required: true
          type: string
          pattern: documents/[^/]+
        - name: blockNumber
          description: The targeted root primary block.
          in: path
          required: true
          type: integer
          format: int32
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/InfrapadServiceSubmitBlockPayloadBody'
      tags:
        - InfrapadService
definitions:
  InfrapadServiceAddBlockBody:
    type: object
    properties:
      block:
        $ref: '#/definitions/v1Block'
    required:
      - block
  InfrapadServiceSubmitBlockPayloadBody:
    type: object
    properties:
      payload:
        type: object
        description: |-
          The complete payload snapshot; its schema is defined by the
          primary block's type (e.g. a Slack thread snapshot).
    required:
      - payload
  InfrapadServiceUpdateBlockBody:
    type: object
    properties:
      block:
        $ref: '#/definitions/v1Block'
    required:
      - block
  protobufAny:
    type: object
    properties:
      '@type':
        type: string
    additionalProperties: true
  protobufNullValue:
    type: string
    enum:
      - NULL_VALUE
    default: NULL_VALUE
    description: |-
      Represents a JSON `null`.

      `NullValue` is a sentinel, using an enum with only one value to represent
      the null value for the `Value` type union.

      A field of type `NullValue` with any value other than `0` is considered
      invalid. Most ProtoJSON serializers will emit a Value with a `null_value` set
      as a JSON `null` regardless of the integer value, and so will round trip to
      a `0` value.

       - NULL_VALUE: Null value.
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
  v1AddBlockResponse:
    type: object
    properties:
      block:
        $ref: '#/definitions/v1Block'
  v1Block:
    type: object
    properties:
      name:
        type: string
        description: 'Resource name: "documents/{document}/blocks/{block}".'
        readOnly: true
      blockNumber:
        type: integer
        format: int32
        readOnly: true
      revisionNumber:
        type: integer
        format: int32
        readOnly: true
      authorId:
        type: string
      type:
        type: string
      status:
        type: string
        title: '"progressing" | "published" | "deleted"'
      createdAt:
        type: string
        format: date-time
        readOnly: true
      parentBlockNumber:
        type: integer
        format: int32
        description: |-
          Immediate generating block in the same document, or unset for a root
          block. Host-owned immutable provenance metadata: it is assigned only
          when the server creates a generated child. Public submissions must
          omit it on creation and may only exactly echo the stored value on
          updates; anything else is rejected with an invalid-argument error.
      record:
        type: object
        description: |-
          - standalone records: {"timestamp": "…", "content": {…}}; records
              generated by an extension also carry their stable "key";
            - grouped records (collections of generated items):
              {"items": [{"timestamp": "…", "key": "…", "content": {…}}, …]}
              in persisted membership order. A collection has no top-level
              timestamp or key; its event time and anchor derive from the
              first member.

          "content" is the inner extension content value, e.g. for
          "Core/Markdown": {"text": "…"}; for "Prometheus/AlertsMatcher":
          {"labels_matchers": [...], "since": "…"}.

          "timestamp" is the read-only event time of the underlying event
          (ordinary blocks keep their creation time), distinct from
          created_at, the creation time of this particular revision.

          Visibility does not grant write authority. Ordinary creation
          supplies only {"content": {…}}; the server assigns the timestamp.
          Ordinary updates may omit the timestamp or exactly echo the stored
          value. Public writes can never assign generated keys or collection
          membership; anything else is rejected with an invalid-argument
          error. Generated blocks are refreshed only through
          SubmitBlockPayload on their root primary.
        title: |-
          The block's serialized host record envelope, exposed verbatim. Its
          shape is determined by `type`:
    description: Block represents a single content block within a document.
    required:
      - type
      - record
  v1CreateDocumentRequest:
    type: object
    properties:
      title:
        type: string
      namespace:
        type: string
      blocks:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Block'
        description: Optional initial blocks.
    required:
      - title
  v1CreateDocumentResponse:
    type: object
    properties:
      document:
        $ref: '#/definitions/v1Document'
  v1Document:
    type: object
    properties:
      name:
        type: string
        description: 'Resource name: "documents/{document}".'
        readOnly: true
      status:
        type: string
        title: '"active" | "archived"'
        readOnly: true
      title:
        type: string
      namespace:
        type: string
      createdAt:
        type: string
        format: date-time
        readOnly: true
      blocks:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Block'
        readOnly: true
    description: Document represents an investigation document.
    required:
      - title
  v1GetBlockResponse:
    type: object
    properties:
      block:
        $ref: '#/definitions/v1Block'
  v1GetDocumentResponse:
    type: object
    properties:
      document:
        $ref: '#/definitions/v1Document'
  v1ListBlockHistoryResponse:
    type: object
    properties:
      blocks:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Block'
  v1ListBlocksResponse:
    type: object
    properties:
      blocks:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Block'
  v1ListDocumentsResponse:
    type: object
    properties:
      documents:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Document'
  v1SubmitBlockPayloadResponse:
    type: object
    properties:
      document:
        $ref: '#/definitions/v1Document'
    description: |-
      The complete refreshed document, captured within the submission
      transaction, with blocks in chronological order.
  v1UpdateBlockResponse:
    type: object
    properties:
      block:
        $ref: '#/definitions/v1Block'
