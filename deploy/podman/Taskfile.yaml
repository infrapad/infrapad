version: '3'
tasks:
  postgres:
    desc: Start PostgreSQL in dev mode
    cmds:
      - ./scripts/start.sh -f postgres.yaml
  monitored-app:
    desc: Start the monitored example app with Prometheus and Alertmanager
    cmds:
      - ./scripts/start.sh -f monitored-app.yaml
  oauth-proxy:
    desc: Start the OpenShift OAuth proxy at https://localhost:8443
    cmds:
      - ./scripts/start.sh -f oauth-proxy.yaml
  dummy-auth-proxy:
    desc: Start the insecure dummy auth proxy at http://localhost:8089
    cmds:
      - ./scripts/start.sh -f dummy-auth-proxy.yaml
  dummy-auth:token:
    desc: Generate an unsigned dummy token (pass --username and optional --email after --)
    dir: ./dummy-auth
    cmds:
      - GOWORK=off go run . token {{.CLI_ARGS}}
  dummy-auth:test:
    desc: Run dummy auth proxy tests
    dir: ./dummy-auth
    cmds:
      - GOWORK=off go test ./...
  dev:run:
    desc: Start all dev services (dummy auth by default; INFRAPAD_AUTH=none opts out)
    cmds:
      - ./scripts/start.sh -f all.yaml
  dev:start:
    desc: Start all dev services in background (dummy auth by default; INFRAPAD_AUTH=none opts out)
    cmds:
      - ./scripts/start.sh -f all.yaml -- -d
  dev:stop:
    desc: Stop all dev services
    cmds:
      - podman compose -f all.yaml --profile "*" down
  dev:logs:
    desc: Follow logs of all dev services
    cmds:
      - podman compose -f all.yaml --profile "*" logs -f
