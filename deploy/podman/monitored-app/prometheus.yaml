global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: monitored-app
    static_configs:
      - targets:
          - monitored-app:8080
