networks:
  infrapad:
    name: infrapad

services:
  oauth-proxy:
    image: quay.io/openshift/origin-oauth-proxy:5.0
    command:
      - --config=/etc/oauth-proxy/oauth-proxy.cfg
      - --kubeconfig=/etc/oauth-proxy/kubeconfig
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./generated/oauth-proxy.cfg:/etc/oauth-proxy/oauth-proxy.cfg:ro,z
      - ./generated/kubeconfig:/etc/oauth-proxy/kubeconfig:ro,z
      - ./generated/cluster-ca.crt:/etc/oauth-proxy/cluster-ca.crt:ro,z
      - ./generated/client-secret:/etc/oauth-proxy/client-secret:ro,z
      - ./generated/cookie-secret:/etc/oauth-proxy/cookie-secret:ro,z
      - ./generated/tls.crt:/etc/oauth-proxy/tls.crt:ro,z
      - ./generated/tls.key:/etc/oauth-proxy/tls.key:ro,z
    userns_mode: keep-id
    extra_hosts:
      - "host.containers.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-kfs", "https://localhost:8443/oauth/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - infrapad
