syntax = "proto3";

package infrapad.v1;

option go_package = "github.com/infrapad/infrapad/proto/gen/go/infrapad/v1;infrapadv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// ==========================================================================
// Messages – domain objects
// ==========================================================================

// Document represents an investigation document.
message Document {
    option (google.api.resource) = {
        type : "infrapad.io/Document"
        pattern : "documents/{document}"
        singular : "document"
        plural : "documents"
    };

    // Resource name: "documents/{document}".
    string name = 1 [
        (google.api.field_behavior) = IDENTIFIER,
        (google.api.field_behavior) = OUTPUT_ONLY
    ];
    string status = 2
        [ (google.api.field_behavior) = OUTPUT_ONLY ]; // "active" | "archived"
    string title = 3 [ (google.api.field_behavior) = REQUIRED ];
    string namespace = 4 [ (google.api.field_behavior) = OPTIONAL ];
    google.protobuf.Timestamp created_at = 5
        [ (google.api.field_behavior) = OUTPUT_ONLY ];
    repeated Block blocks = 6 [ (google.api.field_behavior) = OUTPUT_ONLY ];
}

// Block represents a single content block within a document.
message Block {
    option (google.api.resource) = {
        type : "infrapad.io/Block"
        pattern : "documents/{document}/blocks/{block}"
        singular : "block"
        plural : "blocks"
    };

    // Resource name: "documents/{document}/blocks/{block}".
    string name = 1 [
        (google.api.field_behavior) = IDENTIFIER,
        (google.api.field_behavior) = OUTPUT_ONLY
    ];
    int32 block_number = 2 [ (google.api.field_behavior) = OUTPUT_ONLY ];
    int32 revision_number = 3 [ (google.api.field_behavior) = OUTPUT_ONLY ];
    string author_id = 4 [ (google.api.field_behavior) = OPTIONAL ];
    string type = 5 [ (google.api.field_behavior) = REQUIRED ];
    string status = 6
        [ (google.api.field_behavior) =
              OPTIONAL ]; // "progressing" | "published" | "deleted"
    google.protobuf.Timestamp created_at = 7
        [ (google.api.field_behavior) = OUTPUT_ONLY ];

    // Immediate generating block in the same document, or unset for a root
    // block. Host-owned immutable provenance metadata: it is assigned only
    // when the server creates a generated child. Public submissions must
    // omit it on creation and may only exactly echo the stored value on
    // updates; anything else is rejected with an invalid-argument error.
    optional int32 parent_block_number = 8
        [ (google.api.field_behavior) = OPTIONAL ];

    // The block's serialized host record envelope, exposed verbatim. Its
    // shape is determined by `type`:
    //
    //   - standalone records: {"timestamp": "…", "content": {…}}; records
    //     generated by an extension also carry their stable "key";
    //   - grouped records (collections of generated items):
    //     {"items": [{"timestamp": "…", "key": "…", "content": {…}}, …]}
    //     in persisted membership order. A collection has no top-level
    //     timestamp or key; its event time and anchor derive from the
    //     first member.
    //
    // "content" is the inner extension content value, e.g. for
    // "Core/Markdown": {"text": "…"}; for "Prometheus/AlertsMatcher":
    // {"labels_matchers": [...], "since": "…"}.
    //
    // "timestamp" is the read-only event time of the underlying event
    // (ordinary blocks keep their creation time), distinct from
    // created_at, the creation time of this particular revision.
    //
    // Visibility does not grant write authority. Ordinary creation
    // supplies only {"content": {…}}; the server assigns the timestamp.
    // Ordinary updates may omit the timestamp or exactly echo the stored
    // value. Public writes can never assign generated keys or collection
    // membership; anything else is rejected with an invalid-argument
    // error. Generated blocks are refreshed only through
    // SubmitBlockPayload on their root primary.
    google.protobuf.Struct record = 9 [ (google.api.field_behavior) = REQUIRED ];
}


// ==========================================================================
// Service
// ==========================================================================

service InfrapadService {
    // ----- Document operations -----
    rpc CreateDocument(CreateDocumentRequest) returns (CreateDocumentResponse) {
        option (google.api.http) = {
            post: "/v1/documents"
            body: "*"
        };
    }
    rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse) {
        option (google.api.http) = {
            get: "/v1/{name=documents/*}"
        };
    }
    rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse) {
        option (google.api.http) = {
            get: "/v1/documents"
        };
    }

    // ----- Block operations -----
    rpc AddBlock(AddBlockRequest) returns (AddBlockResponse) {
        option (google.api.http) = {
            post: "/v1/{parent=documents/*}/blocks"
            body: "*"
        };
    }
    rpc UpdateBlock(UpdateBlockRequest) returns (UpdateBlockResponse) {
        option (google.api.http) = {
            put: "/v1/{parent=documents/*}/blocks/{block_number}"
            body: "*"
        };
    }
    rpc GetBlock(GetBlockRequest) returns (GetBlockResponse) {
        option (google.api.http) = {
            get: "/v1/{parent=documents/*}/blocks/{block_number}"
        };
    }
    rpc ListBlocks(ListBlocksRequest) returns (ListBlocksResponse) {
        option (google.api.http) = {
            get: "/v1/{parent=documents/*}/blocks"
        };
    }
    // Submits a complete transient payload snapshot for an existing live
    // root primary block whose type supports expansion (e.g. a
    // "Slack/Thread" reference). The server validates the payload, runs
    // the registered extension selected by the stored block type, and
    // reconciles the generated output atomically. The payload is never
    // persisted. Concurrent submissions serialize per document; the last
    // successful submission wins. Identical snapshots create no
    // revisions.
    //
    // Failures use standard gRPC error details (google.rpc.ErrorInfo with
    // a stable reason and target metadata, google.rpc.BadRequest field
    // violations where available) and leave the document unchanged.
    rpc SubmitBlockPayload(SubmitBlockPayloadRequest)
        returns (SubmitBlockPayloadResponse) {
        option (google.api.http) = {
            post: "/v1/{parent=documents/*}/blocks/{block_number}:submitPayload"
            body: "*"
        };
    }
    rpc ListBlockHistory(ListBlockHistoryRequest)
        returns (ListBlockHistoryResponse) {
        option (google.api.http) = {
            get: "/v1/{parent=documents/*}/blocks/{block_number}/history"
        };
    }
}

// ----- Document requests / responses -----

message CreateDocumentRequest {
    string title = 1 [ (google.api.field_behavior) = REQUIRED ];
    string namespace = 2 [ (google.api.field_behavior) = OPTIONAL ];
    // Optional initial blocks.
    repeated Block blocks = 3 [ (google.api.field_behavior) = OPTIONAL ];
}

message CreateDocumentResponse { Document document = 1; }

message GetDocumentRequest {
    string name = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference).type = "infrapad.io/Document"
    ];
}

message GetDocumentResponse { Document document = 1; }

message ListDocumentsRequest {}

message ListDocumentsResponse { repeated Document documents = 1; }

// ----- Block requests / responses -----

message AddBlockRequest {
    string parent = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference).type = "infrapad.io/Document"
    ];
    Block block = 2 [ (google.api.field_behavior) = REQUIRED ];
}

message AddBlockResponse { Block block = 1; }

message UpdateBlockRequest {
    string parent = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference).type = "infrapad.io/Document"
    ];
    int32 block_number = 2 [ (google.api.field_behavior) = REQUIRED ];
    Block block = 3 [ (google.api.field_behavior) = REQUIRED ];
}

message UpdateBlockResponse { Block block = 1; }

message GetBlockRequest {
    string parent = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference).type = "infrapad.io/Document"
    ];
    int32 block_number = 2 [ (google.api.field_behavior) = REQUIRED ];
    // 0 means latest revision.
    int32 revision_number = 3 [ (google.api.field_behavior) = OPTIONAL ];
}

message GetBlockResponse { Block block = 1; }

message ListBlocksRequest {
    string parent = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference).type = "infrapad.io/Document"
    ];
}

message ListBlocksResponse { repeated Block blocks = 1; }

message ListBlockHistoryRequest {
    string parent = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference).type = "infrapad.io/Document"
    ];
    int32 block_number = 2 [ (google.api.field_behavior) = REQUIRED ];
}

message ListBlockHistoryResponse { repeated Block blocks = 1; }

message SubmitBlockPayloadRequest {
    string parent = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference).type = "infrapad.io/Document"
    ];
    // The targeted root primary block.
    int32 block_number = 2 [ (google.api.field_behavior) = REQUIRED ];
    // The complete payload snapshot; its schema is defined by the
    // primary block's type (e.g. a Slack thread snapshot).
    google.protobuf.Struct payload = 3 [ (google.api.field_behavior) = REQUIRED ];
}

// The complete refreshed document, captured within the submission
// transaction, with blocks in chronological order.
message SubmitBlockPayloadResponse { Document document = 1; }
