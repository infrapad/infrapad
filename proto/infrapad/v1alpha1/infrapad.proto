syntax = "proto3";

package infrapad.v1;

option go_package = "github.com/infrapad/infrapad/proto/gen/go/infrapad/v1;infrapadv1";

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

// ==========================================================================
// Messages – domain objects
// ==========================================================================

// Doc represents an investigation document.
message Doc {
    option (google.api.resource) = {
        type : "infrapad.io/Doc"
        pattern : "docs/{doc}"
        singular : "doc"
        plural : "docs"
    };

    // Resource name: "docs/{doc}".
    string name = 1 [
        (google.api.field_behavior) = IDENTIFIER,
        (google.api.field_behavior) = OUTPUT_ONLY
    ];
    string status = 2
        [ (google.api.field_behavior) = OUTPUT_ONLY ]; // "active" | "archived"
    string title = 3 [ (google.api.field_behavior) = REQUIRED ];
    string namespace = 4 [ (google.api.field_behavior) = OPTIONAL ];
    google.protobuf.Timestamp created_at = 5
        [ (google.api.field_behavior) = OUTPUT_ONLY ];
    repeated Block blocks = 6 [ (google.api.field_behavior) = OUTPUT_ONLY ];
}

// Block represents a single content block within a document.
message Block {
    option (google.api.resource) = {
        type : "infrapad.io/Block"
        pattern : "docs/{doc}/blocks/{block}"
        singular : "block"
        plural : "blocks"
    };

    // Resource name: "docs/{doc}/blocks/{block}".
    string name = 1 [
        (google.api.field_behavior) = IDENTIFIER,
        (google.api.field_behavior) = OUTPUT_ONLY
    ];
    int32 block_number = 2 [ (google.api.field_behavior) = OUTPUT_ONLY ];
    int32 revision_number = 3 [ (google.api.field_behavior) = OUTPUT_ONLY ];
    string author_id = 4 [ (google.api.field_behavior) = OPTIONAL ];
    string type = 5 [ (google.api.field_behavior) =
                          REQUIRED ]; // "markdown" | "alerts_matcher" | …
    string status = 6
        [ (google.api.field_behavior) =
              OPTIONAL ]; // "progressing" | "published" | "deleted"
    google.protobuf.Timestamp created_at = 7
        [ (google.api.field_behavior) = OUTPUT_ONLY ];

    // Exactly one of the typed content fields must be set, matching `type`.
    oneof content {
        MarkdownContent markdown = 10;
        AlertsMatcherContent alerts_matcher = 11;
    }
}

// MarkdownContent is the payload for blocks of type "markdown".
message MarkdownContent {
    string text = 1 [ (google.api.field_behavior) = REQUIRED ];
}

// AlertsMatcherContent is the payload for blocks of type "alerts_matcher".
message AlertsMatcherContent {
    // Each LabelsMatcher is OR-ed; within a matcher the labels are AND-ed.
    // For each label the values are OR-ed.
    // Semantics:  (m1) OR (m2) OR …
    //   where mi = (label1 IN vals1) AND (label2 IN vals2) AND …
    repeated LabelsMatcher labels_matchers = 1
        [ (google.api.field_behavior) = REQUIRED ];
    google.protobuf.Timestamp since = 2
        [ (google.api.field_behavior) = OPTIONAL ];
    google.protobuf.Timestamp until = 3
        [ (google.api.field_behavior) =
              OPTIONAL ]; // zero / unset = open interval
}

// LabelsMatcher is a conjunction of label conditions.
message LabelsMatcher {
    // key → list of acceptable values (OR within a key, AND across keys).
    map<string, LabelValues> labels = 1;
}

// LabelValues is a simple wrapper so we can have repeated strings inside a map.
message LabelValues {
    repeated string values = 1 [ (google.api.field_behavior) = REQUIRED ];
}

// ==========================================================================
// Service
// ==========================================================================

service InfrapadService {
    // ----- Document operations -----
    rpc CreateDoc(CreateDocRequest) returns (CreateDocResponse);
    rpc GetDoc(GetDocRequest) returns (GetDocResponse);
    rpc ListDocs(ListDocsRequest) returns (ListDocsResponse);

    // ----- Block operations -----
    rpc AddBlock(AddBlockRequest) returns (AddBlockResponse);
    rpc UpdateBlock(UpdateBlockRequest) returns (UpdateBlockResponse);
    rpc GetBlock(GetBlockRequest) returns (GetBlockResponse);
    rpc ListBlocks(ListBlocksRequest) returns (ListBlocksResponse);
    rpc ListBlockHistory(ListBlockHistoryRequest)
        returns (ListBlockHistoryResponse);
}

// ----- Document requests / responses -----

message CreateDocRequest {
    string title = 1 [ (google.api.field_behavior) = REQUIRED ];
    string namespace = 2 [ (google.api.field_behavior) = OPTIONAL ];
    // Optional initial blocks.
    repeated Block blocks = 3 [ (google.api.field_behavior) = OPTIONAL ];
}

message CreateDocResponse { Doc doc = 1; }

message GetDocRequest {
    string name = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference).type = "infrapad.io/Doc"
    ];
}

message GetDocResponse { Doc doc = 1; }

message ListDocsRequest {}

message ListDocsResponse { repeated Doc docs = 1; }

// ----- Block requests / responses -----

message AddBlockRequest {
    string parent = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference).type = "infrapad.io/Doc"
    ];
    Block block = 2 [ (google.api.field_behavior) = REQUIRED ];
}

message AddBlockResponse { Block block = 1; }

message UpdateBlockRequest {
    string parent = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference).type = "infrapad.io/Doc"
    ];
    int32 block_number = 2 [ (google.api.field_behavior) = REQUIRED ];
    Block block = 3 [ (google.api.field_behavior) = REQUIRED ];
}

message UpdateBlockResponse { Block block = 1; }

message GetBlockRequest {
    string parent = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference).type = "infrapad.io/Doc"
    ];
    int32 block_number = 2 [ (google.api.field_behavior) = REQUIRED ];
    // 0 means latest revision.
    int32 revision_number = 3 [ (google.api.field_behavior) = OPTIONAL ];
}

message GetBlockResponse { Block block = 1; }

message ListBlocksRequest {
    string parent = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference).type = "infrapad.io/Doc"
    ];
}

message ListBlocksResponse { repeated Block blocks = 1; }

message ListBlockHistoryRequest {
    string parent = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference).type = "infrapad.io/Doc"
    ];
    int32 block_number = 2 [ (google.api.field_behavior) = REQUIRED ];
}

message ListBlockHistoryResponse { repeated Block blocks = 1; }
