version: '3'

vars:
  BINARY: infrapad
  GRPC_ADDR: '{{.GRPC_ADDR | default "localhost:50061"}}'

tasks:
  build:
    desc: Build the CLI binary
    cmds:
      - go build -o {{.BINARY}} .
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BINARY}}"

  install:
    desc: Build the CLI and install it as {{.BINARY}} into $GOPATH/bin
    deps: [build]
    cmds:
      - install -m 0755 ./{{.BINARY}} "$(go env GOPATH)/bin/{{.BINARY}}"

  test:all:
    desc: Run all tests (unit, e2e)
    cmds:
      - task: test:unit
      - task: test:e2e

  test:unit:
    desc: Run unit tests
    cmds:
      - go test ./...
    sources:
      - "**/*.go"
      - go.mod
      - go.sum

  test:e2e:
    desc: "Run CLI e2e tests (requires running server)"
    deps: [build]
    cmds:
      - ./test/e2e/incident_investigation_test.sh
      - ./test/e2e/markdown_test.sh
    env:
      INFRAPAD_CLI: ./{{.BINARY}}
      GRPC_ADDR: "{{.GRPC_ADDR}}"
